name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate metadata and extract notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must have the form vX.Y.Z: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          [[ "$package_version" == "$version" ]] || {
            echo "tag version $version does not match pyproject.toml version $package_version" >&2
            exit 1
          }

          cff_version="$(sed -n 's/^version: //p' CITATION.cff | head -n1)"
          [[ "$cff_version" == "$version" ]] || {
            echo "tag version $version does not match CITATION.cff version $cff_version" >&2
            exit 1
          }

          tag_commit="$(git rev-parse --verify HEAD)"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$tag_commit" == "$main_sha" ]] || {
            echo "release tag must point at current main: tag=$tag_commit main=$main_sha" >&2
            exit 1
          }

          bash .github/scripts/changelog_section.sh CHANGELOG.md "$version" > release-notes.md
          test -s release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ihwkit $GITHUB_REF_NAME" \
            --notes-file release-notes.md
