[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ihwkit"
version = "0.1.1"
description = "Independent Hypothesis Weighting with NumPy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enes Kemal Ergin" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "false discovery rate",
    "independent hypothesis weighting",
    "multiple testing",
    "statistics",
]
dependencies = [
    "numpy>=2.5",
]

[project.urls]
Source = "https://github.com/eneskemalergin/ihwkit"
Issues = "https://github.com/eneskemalergin/ihwkit/issues"
Changelog = "https://github.com/eneskemalergin/ihwkit/blob/main/CHANGELOG.md"
Benchmarks = "https://github.com/eneskemalergin/ihwkit/blob/main/bench/REPORT.md"

[tool.hatch.build.targets.wheel.force-include]
"src/ihw.py" = "ihw.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/bench",
    "/tools",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["src", "."]
