[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ihwkit"
version = "0.1.0"
description = "Independent Hypothesis Weighting with NumPy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Enes Kemal Ergin" }]
keywords = [
    "false discovery rate",
    "independent hypothesis weighting",
    "multiple testing",
    "statistics",
]
dependencies = [
    "numpy",
]

[project.urls]
Source = "https://github.com/eneskemalergin/ihwkit"
Issues = "https://github.com/eneskemalergin/ihwkit/issues"
Benchmarks = "https://github.com/eneskemalergin/ihwkit/blob/main/bench/REPORT.md"

[tool.hatch.build.targets.wheel.force-include]
"src/ihw.py" = "ihw.py"

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["src", "."]
